<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="bgGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#0a0a18" />
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFFF" />
      <stop offset="50%" style="stop-color:#FF00FF" />
      <stop offset="100%" style="stop-color:#FF6600" />
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>

  <!-- Estrellas de fondo -->
  <circle cx="100" cy="150" r="2" fill="#00FFFF" opacity="0.6"/>
  <circle cx="950" cy="250" r="1.5" fill="#FF00FF" opacity="0.5"/>
  <circle cx="200" cy="1700" r="2" fill="#FF6600" opacity="0.7"/>
  <circle cx="880" cy="1800" r="1.5" fill="#00FFFF" opacity="0.6"/>

  <!-- TÍTULO -->
  <text
    x="540"
    y="160"
    text-anchor="middle"
    font-family="Arial Black, sans-serif"
    font-size="56"
    font-weight="900"
    letter-spacing="2"
    fill="url(#titleGrad)"
    filter="url(#strongGlow)"
  >10 MUNDOS ÚNICOS</text>

  <!-- MUNDOS (planetas orbitales) -->
  <!-- Mundo 1 - Verde/Cyan -->
  <g transform="translate(180, 380)">
    <circle r="60" fill="none" stroke="#00FFFF" stroke-width="20" opacity="0.1" filter="url(#strongGlow)"/>
    <circle r="45" fill="#00FFFF" opacity="0.3" filter="url(#glow)"/>
    <circle r="42" fill="#1a1a2e" stroke="#00FFFF" stroke-width="2.5" opacity="0.9"/>
    <circle r="15" fill="#00FFFF" opacity="0.9"/>
    <text y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#00FFFF">W1</text>
  </g>

  <!-- Mundo 2 - Magenta -->
  <g transform="translate(540, 380)">
    <circle r="60" fill="none" stroke="#FF00FF" stroke-width="20" opacity="0.1" filter="url(#strongGlow)"/>
    <circle r="45" fill="#FF00FF" opacity="0.3" filter="url(#glow)"/>
    <circle r="42" fill="#1a1a2e" stroke="#FF00FF" stroke-width="2.5" opacity="0.9"/>
    <circle r="15" fill="#FF00FF" opacity="0.9"/>
    <text y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FF00FF">W2</text>
  </g>

  <!-- Mundo 3 - Naranja -->
  <g transform="translate(900, 380)">
    <circle r="60" fill="none" stroke="#FF6600" stroke-width="20" opacity="0.1" filter="url(#strongGlow)"/>
    <circle r="45" fill="#FF6600" opacity="0.3" filter="url(#glow)"/>
    <circle r="42" fill="#1a1a2e" stroke="#FF6600" stroke-width="2.5" opacity="0.9"/>
    <circle r="15" fill="#FF6600" opacity="0.9"/>
    <text y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FF6600">W3</text>
  </g>

  <!-- Mundo 4 - Amarillo -->
  <g transform="translate(270, 600)">
    <circle r="55" fill="none" stroke="#FFFF00" stroke-width="18" opacity="0.1" filter="url(#strongGlow)"/>
    <circle r="42" fill="#FFFF00" opacity="0.3" filter="url(#glow)"/>
    <circle r="39" fill="#1a1a2e" stroke="#FFFF00" stroke-width="2.5" opacity="0.9"/>
    <circle r="14" fill="#FFFF00" opacity="0.9"/>
    <text y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFF00">W4</text>
  </g>

  <!-- Mundo 5 - Verde -->
  <g transform="translate(810, 600)">
    <circle r="55" fill="none" stroke="#00FF88" stroke-width="18" opacity="0.1" filter="url(#strongGlow)"/>
    <circle r="42" fill="#00FF88" opacity="0.3" filter="url(#glow)"/>
    <circle r="39" fill="#1a1a2e" stroke="#00FF88" stroke-width="2.5" opacity="0.9"/>
    <circle r="14" fill="#00FF88" opacity="0.9"/>
    <text y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#00FF88">W5</text>
  </g>

  <!-- Mundo 6 - Azul -->
  <g transform="translate(180, 820)">
    <circle r="55" fill="none" stroke="#0088FF" stroke-width="18" opacity="0.1" filter="url(#strongGlow)"/>
    <circle r="42" fill="#0088FF" opacity="0.3" filter="url(#glow)"/>
    <circle r="39" fill="#1a1a2e" stroke="#0088FF" stroke-width="2.5" opacity="0.9"/>
    <circle r="14" fill="#0088FF" opacity="0.9"/>
    <text y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0088FF">W6</text>
  </g>

  <!-- Mundo 7 - Púrpura -->
  <g transform="translate(540, 820)">
    <circle r="55" fill="none" stroke="#8800FF" stroke-width="18" opacity="0.1" filter="url(#strongGlow)"/>
    <circle r="42" fill="#8800FF" opacity="0.3" filter="url(#glow)"/>
    <circle r="39" fill="#1a1a2e" stroke="#8800FF" stroke-width="2.5" opacity="0.9"/>
    <circle r="14" fill="#8800FF" opacity="0.9"/>
    <text y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8800FF">W7</text>
  </g>

  <!-- Mundo 8 - Rosa -->
  <g transform="translate(900, 820)">
    <circle r="55" fill="none" stroke="#FF0088" stroke-width="18" opacity="0.1" filter="url(#strongGlow)"/>
    <circle r="42" fill="#FF0088" opacity="0.3" filter="url(#glow)"/>
    <circle r="39" fill="#1a1a2e" stroke="#FF0088" stroke-width="2.5" opacity="0.9"/>
    <circle r="14" fill="#FF0088" opacity="0.9"/>
    <text y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FF0088">W8</text>
  </g>

  <!-- Mundo 9 - Rojo -->
  <g transform="translate(360, 1040)">
    <circle r="55" fill="none" stroke="#FF0000" stroke-width="18" opacity="0.1" filter="url(#strongGlow)"/>
    <circle r="42" fill="#FF0000" opacity="0.3" filter="url(#glow)"/>
    <circle r="39" fill="#1a1a2e" stroke="#FF0000" stroke-width="2.5" opacity="0.9"/>
    <circle r="14" fill="#FF0000" opacity="0.9"/>
    <text y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FF0000">W9</text>
  </g>

  <!-- Mundo 10 - Blanco/Omega -->
  <g transform="translate(720, 1040)">
    <circle r="65" fill="none" stroke="#FFFFFF" stroke-width="22" opacity="0.15" filter="url(#strongGlow)"/>
    <circle r="48" fill="#FFFFFF" opacity="0.3" filter="url(#glow)"/>
    <circle r="45" fill="#1a1a2e" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <circle r="16" fill="#FFFFFF" opacity="0.95"/>
    <text y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">W10</text>
  </g>

  <!-- Líneas de conexión entre mundos -->
  <g opacity="0.2" stroke-dasharray="5,3">
    <line x1="180" y1="380" x2="540" y2="380" stroke="#00FFFF" stroke-width="2"/>
    <line x1="540" y1="380" x2="900" y2="380" stroke="#FF00FF" stroke-width="2"/>
    <line x1="900" y1="380" x2="810" y2="600" stroke="#FF6600" stroke-width="2"/>
    <line x1="180" y1="820" x2="540" y2="820" stroke="#0088FF" stroke-width="2"/>
    <line x1="540" y1="820" x2="900" y2="820" stroke="#8800FF" stroke-width="2"/>
    <line x1="360" y1="1040" x2="720" y2="1040" stroke="#FF0000" stroke-width="2"/>
  </g>

  <!-- TEXTO PRINCIPAL -->
  <text
    x="540"
    y="1350"
    text-anchor="middle"
    font-family="Arial Black, sans-serif"
    font-size="52"
    font-weight="900"
    letter-spacing="2"
    fill="#00FFFF"
    filter="url(#strongGlow)"
  >EXPLORA 10 MUNDOS</text>

  <text
    x="540"
    y="1440"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="38"
    font-weight="700"
    letter-spacing="1.5"
    fill="#FF00FF"
    opacity="0.95"
    filter="url(#glow)"
  >Cada uno con desafíos únicos</text>

  <text
    x="540"
    y="1520"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="38"
    font-weight="700"
    letter-spacing="1.5"
    fill="#FF6600"
    opacity="0.95"
    filter="url(#glow)"
  >y enemigos más poderosos</text>

  <!-- Panel de progresión -->
  <g opacity="0.9">
    <rect x="240" y="1620" width="600" height="90" rx="12" fill="#0a0a18" opacity="0.9" stroke="#00FFFF" stroke-width="3" filter="url(#glow)"/>

    <text x="540" y="1660" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" opacity="0.7">PROGRESIÓN</text>

    <!-- Barra de progreso -->
    <rect x="280" y="1680" width="520" height="16" rx="8" fill="#1a1a2e" stroke="#00FFFF" stroke-width="1"/>
    <rect x="280" y="1680" width="312" height="16" rx="8" fill="url(#titleGrad)" opacity="0.8" filter="url(#glow)"/>

    <text x="800" y="1693" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#00FFFF">60%</text>
  </g>

  <!-- Brackets decorativos -->
  <g opacity="0.7">
    <path d="M 50,50 L 50,140 M 50,50 L 140,50" stroke="#00FFFF" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 1030,50 L 1030,140 M 1030,50 L 940,50" stroke="#FF00FF" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 50,1870 L 50,1780 M 50,1870 L 140,1870" stroke="#FF6600" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 1030,1870 L 1030,1780 M 1030,1870 L 940,1870" stroke="#00FFFF" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  </g>

</svg>
