name: bored_games
description: "A sample Flutter app scaffolded inside Docker."
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.17.0
  flame_tiled: ^1.18.2
  flame_audio: ^2.0.3
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/maps/level1.json
