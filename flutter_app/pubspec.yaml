name: bored_games
description: "Neon Defense - A Tron-style Tower Defense game built with Flutter + Flame"
version: 1.0.0
publish_to: "none"
homepage: https://github.com/yourusername/BoredGames

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.17.0
  flame_tiled: ^1.18.2
  flame_audio: ^2.0.3
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  vector_math: ^2.1.4
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flame_test: ^1.17.0

flutter:
  uses-material-design: true
  assets:
    - assets/tiles/maps/
    - assets/config/shader_presets.json
  shaders:
    - assets/shaders/world_uber_shader.frag
    - assets/shaders/particle_trail_shader.frag
    - assets/shaders/post_process_master.frag
