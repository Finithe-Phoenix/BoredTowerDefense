[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unreal-mcp"
version = "0.1.0"
description = "MCP server for controlling Unreal Engine 5 Editor through Remote Control API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27.0"
]

[project.scripts]
unreal-mcp = "unreal_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
