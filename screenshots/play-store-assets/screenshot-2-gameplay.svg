<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="bgGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a18;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFFF" />
      <stop offset="100%" style="stop-color:#FF00FF" />
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>

  <!-- Grid simulado -->
  <g opacity="0.15">
    <line x1="0" y1="640" x2="1080" y2="640" stroke="#00FFFF" stroke-width="1"/>
    <line x1="0" y1="1280" x2="1080" y2="1280" stroke="#00FFFF" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="1920" stroke="#00FFFF" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="1920" stroke="#00FFFF" stroke-width="1"/>
  </g>

  <!-- TÍTULO SUPERIOR -->
  <text
    x="540"
    y="180"
    text-anchor="middle"
    font-family="Arial Black, sans-serif"
    font-size="56"
    font-weight="900"
    letter-spacing="2"
    fill="url(#textGrad)"
    filter="url(#strongGlow)"
  >ESTRATEGIA TÁCTICA</text>

  <!-- TORRES DEFENDIENDO (3 torres) -->
  <!-- Torre 1 (izquierda) -->
  <g transform="translate(220, 550)">
    <circle r="100" fill="none" stroke="#00FFFF" stroke-width="30" opacity="0.08" filter="url(#strongGlow)"/>
    <polygon points="0,-70 60.5,-35 60.5,35 0,70 -60.5,35 -60.5,-35" fill="none" stroke="#00FFFF" stroke-width="2.5" opacity="0.6" filter="url(#glow)"/>
    <polygon points="0,-55 47.5,-27.5 47.5,27.5 0,55 -47.5,27.5 -47.5,-27.5" fill="#00CCCC" stroke="#00FFFF" stroke-width="2" filter="url(#glow)"/>
    <circle r="22" fill="#00FFFF" opacity="0.9" filter="url(#glow)"/>
    <circle r="22" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Torre 2 (centro) -->
  <g transform="translate(540, 650)">
    <circle r="110" fill="none" stroke="#FF00FF" stroke-width="32" opacity="0.08" filter="url(#strongGlow)"/>
    <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="none" stroke="#FF00FF" stroke-width="2.5" opacity="0.6" filter="url(#glow)"/>
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#CC00CC" stroke="#FF00FF" stroke-width="2" filter="url(#glow)"/>
    <circle r="25" fill="#FF00FF" opacity="0.9" filter="url(#glow)"/>
    <circle r="25" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Torre 3 (derecha) -->
  <g transform="translate(860, 550)">
    <circle r="100" fill="none" stroke="#FF6600" stroke-width="30" opacity="0.08" filter="url(#strongGlow)"/>
    <polygon points="0,-70 60.5,-35 60.5,35 0,70 -60.5,35 -60.5,-35" fill="none" stroke="#FF6600" stroke-width="2.5" opacity="0.6" filter="url(#glow)"/>
    <polygon points="0,-55 47.5,-27.5 47.5,27.5 0,55 -47.5,27.5 -47.5,-27.5" fill="#CC6600" stroke="#FF6600" stroke-width="2" filter="url(#glow)"/>
    <circle r="22" fill="#FF6600" opacity="0.9" filter="url(#glow)"/>
    <circle r="22" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- OLEADA DE ENEMIGOS (6 enemigos atacando) -->
  <!-- Enemigo 1 -->
  <g transform="translate(180, 950)">
    <circle r="55" fill="none" stroke="#FF0066" stroke-width="18" opacity="0.12" filter="url(#strongGlow)"/>
    <circle r="40" fill="#FF0066" opacity="0.25" filter="url(#glow)"/>
    <circle r="37" fill="#1a0a18" stroke="#FF00FF" stroke-width="2.5" opacity="0.9"/>
    <line x1="0" y1="-37" x2="0" y2="-55" stroke="#FF00FF" stroke-width="3" filter="url(#glow)"/>
    <line x1="37" y1="0" x2="55" y2="0" stroke="#FF00FF" stroke-width="3" filter="url(#glow)"/>
    <line x1="0" y1="37" x2="0" y2="55" stroke="#FF00FF" stroke-width="3" filter="url(#glow)"/>
    <line x1="-37" y1="0" x2="-55" y2="0" stroke="#FF00FF" stroke-width="3" filter="url(#glow)"/>
    <circle r="16" fill="#FF0066" opacity="0.9"/>
  </g>

  <!-- Enemigo 2 -->
  <g transform="translate(420, 1000)">
    <polygon points="0,-48 41,24 -41,24" fill="#FF0066" opacity="0.25" filter="url(#glow)"/>
    <polygon points="0,-44 38,22 -38,22" fill="#1a0a18" stroke="#FF6600" stroke-width="2.5" opacity="0.9"/>
    <line x1="0" y1="-44" x2="0" y2="-65" stroke="#FF6600" stroke-width="3" filter="url(#glow)"/>
    <circle cy="-12" r="15" fill="#FF6600" opacity="0.9"/>
  </g>

  <!-- Enemigo 3 -->
  <g transform="translate(660, 1050)">
    <circle r="50" fill="none" stroke="#FF0066" stroke-width="16" opacity="0.12" filter="url(#strongGlow)"/>
    <circle r="38" fill="#FF0066" opacity="0.25" filter="url(#glow)"/>
    <circle r="35" fill="#1a0a18" stroke="#FF00FF" stroke-width="2.5" opacity="0.9"/>
    <line x1="0" y1="-35" x2="0" y2="-52" stroke="#FF00FF" stroke-width="3" filter="url(#glow)"/>
    <line x1="25" y1="-25" x2="37" y2="-37" stroke="#FF00FF" stroke-width="3" filter="url(#glow)"/>
    <line x1="35" y1="0" x2="52" y2="0" stroke="#FF00FF" stroke-width="3" filter="url(#glow)"/>
    <circle r="14" fill="#FF0066" opacity="0.9"/>
  </g>

  <!-- Enemigo 4 -->
  <g transform="translate(900, 1020)">
    <polygon points="0,-46 39,23 -39,23" fill="#FF0066" opacity="0.25" filter="url(#glow)"/>
    <polygon points="0,-42 36,21 -36,21" fill="#1a0a18" stroke="#FF6600" stroke-width="2.5" opacity="0.9"/>
    <line x1="0" y1="-42" x2="0" y2="-62" stroke="#FF6600" stroke-width="3" filter="url(#glow)"/>
    <circle cy="-10" r="14" fill="#FF6600" opacity="0.9"/>
  </g>

  <!-- Enemigo 5 -->
  <g transform="translate(300, 1200)">
    <circle r="48" fill="none" stroke="#FF0066" stroke-width="15" opacity="0.12" filter="url(#strongGlow)"/>
    <circle r="36" fill="#FF0066" opacity="0.25" filter="url(#glow)"/>
    <circle r="33" fill="#1a0a18" stroke="#FF00FF" stroke-width="2.5" opacity="0.9"/>
    <line x1="0" y1="-33" x2="0" y2="-50" stroke="#FF00FF" stroke-width="3" filter="url(#glow)"/>
    <line x1="33" y1="0" x2="50" y2="0" stroke="#FF00FF" stroke-width="3" filter="url(#glow)"/>
    <circle r="13" fill="#FF0066" opacity="0.9"/>
  </g>

  <!-- Enemigo 6 -->
  <g transform="translate(780, 1180)">
    <circle r="52" fill="none" stroke="#FF0066" stroke-width="17" opacity="0.12" filter="url(#strongGlow)"/>
    <circle r="39" fill="#FF0066" opacity="0.25" filter="url(#glow)"/>
    <circle r="36" fill="#1a0a18" stroke="#FF00FF" stroke-width="2.5" opacity="0.9"/>
    <line x1="0" y1="-36" x2="0" y2="-54" stroke="#FF00FF" stroke-width="3" filter="url(#glow)"/>
    <line x1="26" y1="-26" x2="38" y2="-38" stroke="#FF00FF" stroke-width="3" filter="url(#glow)"/>
    <circle r="15" fill="#FF0066" opacity="0.9"/>
  </g>

  <!-- EFECTOS DE DISPARO/ENERGÍA (líneas de las torres a los enemigos) -->
  <line x1="220" y1="550" x2="180" y2="950" stroke="#00FFFF" stroke-width="3" opacity="0.7" stroke-dasharray="8,4" filter="url(#glow)"/>
  <line x1="540" y1="650" x2="420" y2="1000" stroke="#FF00FF" stroke-width="3" opacity="0.7" stroke-dasharray="8,4" filter="url(#glow)"/>
  <line x1="860" y1="550" x2="900" y2="1020" stroke="#FF6600" stroke-width="3" opacity="0.7" stroke-dasharray="8,4" filter="url(#glow)"/>

  <!-- TEXTO PRINCIPAL -->
  <text
    x="540"
    y="1480"
    text-anchor="middle"
    font-family="Arial Black, sans-serif"
    font-size="52"
    font-weight="900"
    letter-spacing="2"
    fill="#00FFFF"
    filter="url(#strongGlow)"
  >COLOCA TUS TORRES</text>

  <text
    x="540"
    y="1560"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="38"
    font-weight="700"
    letter-spacing="1.5"
    fill="#FF00FF"
    opacity="0.95"
    filter="url(#glow)"
  >Defiende contra oleadas</text>

  <text
    x="540"
    y="1630"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="38"
    font-weight="700"
    letter-spacing="1.5"
    fill="#FF6600"
    opacity="0.95"
    filter="url(#glow)"
  >de enemigos imparables</text>

  <!-- Stats simulados -->
  <g opacity="0.9">
    <!-- Wave counter -->
    <rect x="80" y="300" width="180" height="70" rx="8" fill="#0a0a18" opacity="0.9" stroke="#00FFFF" stroke-width="2" filter="url(#glow)"/>
    <text x="170" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#00FFFF">WAVE 5</text>

    <!-- Score -->
    <rect x="820" y="300" width="180" height="70" rx="8" fill="#0a0a18" opacity="0.9" stroke="#FF00FF" stroke-width="2" filter="url(#glow)"/>
    <text x="910" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FF00FF">SCORE: 2,450</text>
  </g>

  <!-- Brackets decorativos -->
  <g opacity="0.7">
    <path d="M 50,50 L 50,140 M 50,50 L 140,50" stroke="#00FFFF" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 1030,50 L 1030,140 M 1030,50 L 940,50" stroke="#FF00FF" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 50,1870 L 50,1780 M 50,1870 L 140,1870" stroke="#FF6600" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 1030,1870 L 1030,1780 M 1030,1870 L 940,1870" stroke="#00FFFF" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  </g>

</svg>
