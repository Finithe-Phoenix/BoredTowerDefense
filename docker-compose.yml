services:
  bored-games:
    container_name: bored_games_flutter
    build:
      context: .
      args:
        APP_ENV: dev
    ports:
      - 3001:8080
    volumes:
      - ./flutter_app:/app/flutter_app
    environment:
      - APP_ENV=dev
    tty: true
    stdin_open: true
    # Por defecto ejecuta pruebas antes de iniciar la app
    # Para saltarse las pruebas, usar: docker-compose run bored-games-dev

  # Servicio alternativo para desarrollo sin pruebas
  bored-games-dev:
    container_name: bored_games_flutter_dev
    build:
      context: .
      args:
        APP_ENV: dev
    ports:
      - 3002:8080
    volumes:
      - ./flutter_app:/app/flutter_app
    environment:
      - APP_ENV=dev
    tty: true
    stdin_open: true
    command: ["./entrypoint-no-tests.sh"]
