<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Definiciones -->
  <defs>
    <!-- Glow filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradientes -->
    <radialGradient id="bgGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a18;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF00FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6600;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="energyCore" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#00FFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FF00FF;stop-opacity:0.5" />
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1024" height="500" fill="url(#bgGradient)"/>

  <!-- Grid pattern (sutil) -->
  <g opacity="0.15">
    <line x1="0" y1="125" x2="1024" y2="125" stroke="#00FFFF" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="1024" y2="250" stroke="#00FFFF" stroke-width="0.5"/>
    <line x1="0" y1="375" x2="1024" y2="375" stroke="#00FFFF" stroke-width="0.5"/>
    <line x1="256" y1="0" x2="256" y2="500" stroke="#00FFFF" stroke-width="0.5"/>
    <line x1="512" y1="0" x2="512" y2="500" stroke="#00FFFF" stroke-width="0.5"/>
    <line x1="768" y1="0" x2="768" y2="500" stroke="#00FFFF" stroke-width="0.5"/>
  </g>

  <!-- Estrellas de fondo -->
  <circle cx="100" cy="80" r="1.5" fill="#00FFFF" opacity="0.6"/>
  <circle cx="200" cy="120" r="1" fill="#FF00FF" opacity="0.5"/>
  <circle cx="850" cy="90" r="1.2" fill="#00FFFF" opacity="0.7"/>
  <circle cx="920" cy="150" r="1.5" fill="#FF6600" opacity="0.6"/>
  <circle cx="150" cy="400" r="1" fill="#FF00FF" opacity="0.6"/>
  <circle cx="900" cy="420" r="1.3" fill="#00FFFF" opacity="0.5"/>
  <circle cx="80" cy="300" r="1" fill="#FF6600" opacity="0.7"/>
  <circle cx="950" cy="280" r="1.5" fill="#00FFFF" opacity="0.7"/>

  <!-- Líneas de energía de fondo -->
  <line x1="0" y1="100" x2="300" y2="50" stroke="#00FFFF" stroke-width="1" opacity="0.2" stroke-dasharray="5,5"/>
  <line x1="1024" y1="400" x2="724" y2="450" stroke="#FF00FF" stroke-width="1" opacity="0.2" stroke-dasharray="5,5"/>

  <!-- ENEMIGO IZQUIERDO (grande y amenazante) -->
  <g transform="translate(180, 250)">
    <!-- Glow exterior -->
    <circle r="70" fill="none" stroke="#FF0066" stroke-width="20" opacity="0.15" filter="url(#strongGlow)"/>

    <!-- Cuerpo del enemigo -->
    <circle r="50" fill="#FF0066" opacity="0.3" filter="url(#glow)"/>
    <circle r="45" fill="#1a0a18" stroke="#FF00FF" stroke-width="2.5" opacity="0.9"/>

    <!-- Púas rotatorias -->
    <g opacity="0.8">
      <line x1="0" y1="-45" x2="0" y2="-65" stroke="#FF00FF" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
      <line x1="32" y1="-32" x2="46" y2="-46" stroke="#FF00FF" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
      <line x1="45" y1="0" x2="65" y2="0" stroke="#FF00FF" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
      <line x1="32" y1="32" x2="46" y2="46" stroke="#FF00FF" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
      <line x1="0" y1="45" x2="0" y2="65" stroke="#FF00FF" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
      <line x1="-32" y1="32" x2="-46" y2="46" stroke="#FF00FF" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
      <line x1="-45" y1="0" x2="-65" y2="0" stroke="#FF00FF" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
      <line x1="-32" y1="-32" x2="-46" y2="-46" stroke="#FF00FF" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    </g>

    <!-- Core del enemigo -->
    <circle r="20" fill="#FF0066" opacity="0.9" filter="url(#glow)"/>
    <circle r="15" fill="#FF00FF" opacity="0.8"/>
  </g>

  <!-- TORRE CENTRAL (protagonista) -->
  <g transform="translate(512, 250)">
    <!-- Glow masivo -->
    <circle r="110" fill="none" stroke="#00FFFF" stroke-width="40" opacity="0.1" filter="url(#strongGlow)"/>

    <!-- Hexágono exterior -->
    <polygon
      points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45"
      fill="none"
      stroke="#00FFFF"
      stroke-width="2.5"
      opacity="0.6"
      filter="url(#glow)"
    />

    <!-- Hexágono medio -->
    <polygon
      points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5"
      fill="#0a0a18"
      stroke="#FF00FF"
      stroke-width="2"
      opacity="0.85"
      filter="url(#glow)"
    />

    <!-- Detalles internos -->
    <line x1="-65" y1="-37.5" x2="0" y2="0" stroke="#00FFFF" stroke-width="1.5" opacity="0.4"/>
    <line x1="65" y1="-37.5" x2="0" y2="0" stroke="#00FFFF" stroke-width="1.5" opacity="0.4"/>
    <line x1="65" y1="37.5" x2="0" y2="0" stroke="#00FFFF" stroke-width="1.5" opacity="0.4"/>
    <line x1="-65" y1="37.5" x2="0" y2="0" stroke="#00FFFF" stroke-width="1.5" opacity="0.4"/>

    <!-- Torre interna -->
    <polygon
      points="0,-55 48,-27.5 48,27.5 0,55 -48,27.5 -48,-27.5"
      fill="#00CCCC"
      stroke="#00FFFF"
      stroke-width="2"
      filter="url(#glow)"
    />

    <!-- Segmentos de la torre -->
    <line x1="-48" y1="-27.5" x2="-48" y2="27.5" stroke="#0a0a18" stroke-width="2" opacity="0.5"/>
    <line x1="48" y1="-27.5" x2="48" y2="27.5" stroke="#0a0a18" stroke-width="2" opacity="0.5"/>
    <line x1="-48" y1="0" x2="48" y2="0" stroke="#0a0a18" stroke-width="2" opacity="0.3"/>

    <!-- Core de energía masivo -->
    <circle r="30" fill="url(#energyCore)" filter="url(#strongGlow)"/>
    <circle r="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9" filter="url(#glow)"/>
    <circle r="25" fill="none" stroke="#00FFFF" stroke-width="1.5" opacity="0.7"/>
    <circle r="20" fill="none" stroke="#FF00FF" stroke-width="1" opacity="0.6"/>

    <!-- Puntos orbitales -->
    <circle cx="38" cy="0" r="3.5" fill="#00FFFF" opacity="0.95" filter="url(#glow)"/>
    <circle cx="-38" cy="0" r="3.5" fill="#FF00FF" opacity="0.95" filter="url(#glow)"/>
    <circle cx="0" cy="38" r="3.5" fill="#FF6600" opacity="0.95" filter="url(#glow)"/>
    <circle cx="0" cy="-38" r="3.5" fill="#00FFFF" opacity="0.95" filter="url(#glow)"/>
  </g>

  <!-- ENEMIGO DERECHO (diferente tipo) -->
  <g transform="translate(844, 250) rotate(15)">
    <!-- Glow -->
    <circle r="65" fill="none" stroke="#FF6600" stroke-width="18" opacity="0.12" filter="url(#strongGlow)"/>

    <!-- Cuerpo triangular agresivo -->
    <polygon
      points="0,-50 43,25 -43,25"
      fill="#FF0066"
      opacity="0.25"
      filter="url(#glow)"
    />
    <polygon
      points="0,-45 38,22 -38,22"
      fill="#1a0a18"
      stroke="#FF6600"
      stroke-width="2.5"
      opacity="0.9"
      filter="url(#glow)"
    />

    <!-- Púas del triángulo -->
    <line x1="0" y1="-45" x2="0" y2="-68" stroke="#FF6600" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <line x1="38" y1="22" x2="56" y2="33" stroke="#FF6600" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <line x1="-38" y1="22" x2="-56" y2="33" stroke="#FF6600" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Core -->
    <circle cy="-10" r="18" fill="#FF6600" opacity="0.85" filter="url(#glow)"/>
    <circle cy="-10" r="13" fill="#FF00FF" opacity="0.75"/>
  </g>

  <!-- TÍTULO DEL JUEGO -->
  <g transform="translate(512, 100)">
    <!-- Sombra/glow del título -->
    <text
      text-anchor="middle"
      font-family="Arial Black, sans-serif"
      font-size="52"
      font-weight="900"
      letter-spacing="4"
      fill="url(#titleGradient)"
      opacity="0.3"
      filter="url(#strongGlow)"
    >BORED TOWER DEFENSE</text>

    <!-- Título principal -->
    <text
      text-anchor="middle"
      font-family="Arial Black, sans-serif"
      font-size="52"
      font-weight="900"
      letter-spacing="4"
      fill="url(#titleGradient)"
      filter="url(#glow)"
    >BORED TOWER DEFENSE</text>

    <!-- Outline del título -->
    <text
      text-anchor="middle"
      font-family="Arial Black, sans-serif"
      font-size="52"
      font-weight="900"
      letter-spacing="4"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="1"
      opacity="0.6"
    >BORED TOWER DEFENSE</text>
  </g>

  <!-- TAGLINE -->
  <text
    x="512"
    y="420"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="24"
    font-weight="700"
    letter-spacing="3"
    fill="#00FFFF"
    opacity="0.9"
    filter="url(#glow)"
  >DEFEND • UPGRADE • CONQUER</text>

  <!-- Brackets decorativos en las esquinas -->
  <!-- Top-left -->
  <g opacity="0.7">
    <path d="M 30,30 L 30,80 M 30,30 L 80,30" stroke="#00FFFF" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 25,25 L 25,85 M 25,25 L 85,25" stroke="#00FFFF" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Top-right -->
  <g opacity="0.7">
    <path d="M 994,30 L 994,80 M 994,30 L 944,30" stroke="#FF00FF" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 999,25 L 999,85 M 999,25 L 939,25" stroke="#FF00FF" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Bottom-left -->
  <g opacity="0.7">
    <path d="M 30,470 L 30,420 M 30,470 L 80,470" stroke="#FF6600" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 25,475 L 25,415 M 25,475 L 85,475" stroke="#FF6600" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Bottom-right -->
  <g opacity="0.7">
    <path d="M 994,470 L 994,420 M 994,470 L 944,470" stroke="#00FFFF" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 999,475 L 999,415 M 999,475 L 939,475" stroke="#00FFFF" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Líneas de escaneo (efecto tech) -->
  <line x1="0" y1="250" x2="1024" y2="250" stroke="#00FFFF" stroke-width="1" opacity="0.15" stroke-dasharray="10,5"/>

</svg>
